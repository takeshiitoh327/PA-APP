<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com https://api.open-meteo.com https://nominatim.openstreetmap.org; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
  <title>個人助理</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">今天</h1>
    <div class="topbar-actions">
      <button id="refresh" class="icon-btn" aria-label="重新整理">↻</button>
      <a href="#/settings" class="icon-btn" aria-label="設定">⚙</a>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabs">
    <a href="#/today" data-tab="today"><span>📅</span>今天</a>
    <a href="#/log" data-tab="log"><span>✏️</span>日誌</a>
    <a href="#/stats" data-tab="stats"><span>📊</span>統計</a>
  </nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="tip" hidden></div>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
